services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sakuskill_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ganti_password_lokal_anda
      POSTGRES_DB: sakuskill_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
